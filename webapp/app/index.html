<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>VTracer</title>
        <link rel="apple-touch-icon" sizes="192x192" href="./assets/apple-icon.png">
        <link rel="icon" type="image/png" sizes="192x192"  href="./assets/apple-icon.png">
        <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }
        .button {
            cursor: pointer;
            font-family: sans-serif;
            border-radius: 2px;
            border: 1px solid #aaa;
            padding: 4px 8px;
        }
        #droptext {
            border: 2px dashed #000;
        }
        #droptext.hovering {
            border: 2px dashed #fff;
        }
        #canvas-container {
            position: absolute;
            left: 2.5%;
            top: 5%;
            width: 95%;
            height: 90%;
        }
        #svg, #frame {
            position: absolute;
            width: 100%;
            margin-bottom: 50px;
        }
        #svg > path:hover {
            stroke: #ff0;
        }
        #droptext {
            height: 100%;
            text-align: center;
        }
        #options {
            position: absolute;
            left: 2.5%;
            top: 5%;
            padding: 50px;
            background: rgba(255,255,255,0.5);
        }
        </style>
    </head>

    <body>
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <div>
            <div id="progressregion" style="display: none;">
                <progress id="progressbar" value="0" max="100" style="width: 98%;"></progress>
            </div>
            <div>
                <div id="drop">
                    <div id="canvas-container">
                        <div id="droptext">
                            <p>拖拽图片到这里 或 <a href="#" id="imageSelect">选择文件</a></p>
                        </div>
                        <canvas id="frame"></canvas>
                        <svg id="svg" version="1.1" xmlns="http://www.w3.org/2000/svg"></svg>
                    </div>
                </div>
            </div>
            <div id="options">
                <div>
                    <a class="button" id="export">下载 SVG 文件</a>    
                </div>

                <p></p>

                <div>
                    <div title="用于像素簇分割与分组的算法">
                        聚类算法
                    </div>
                </div>

                <div>
                    <div>
                        <button id="clustering-binary" title="黑白（二值化图像）">黑白</button>
                        <button id="clustering-color" title="真彩色图像">彩色</button>
                    </div>
                </div>

                <div>
                    <div>
                        <button id="clustering-cutout" title="形状之间互不重叠">镂空</button>
                        <button id="clustering-stacked" title="将形状自下而上层叠">层叠</button>
                    </div>
                </div>

                <div>
                    <div title="丢弃小于指定像素大小的微小色块">
                        过滤噪点 <span>(画面更干净)</span>
                    </div>
                </div>
                <div id="filterspecklevalue">
                    4
                </div>
                <div>
                    <input id="filterspeckle" type="range" min="1" max="16" step="1" value="4">
                </div>

                <div class="clustering-color-options">
                    <div title="RGB 通道中使用的有效位数">
                        色彩精度 <span>(还原更准确)</span>
                    </div>
                </div>
                <div id="colorprecisionvalue" class="clustering-color-options">
                    6
                </div>
                <div class="clustering-color-options">
                    <input id="colorprecision" type="range" min="1" max="8" step="1" value="6">
                </div>

                <div class="clustering-color-options">
                    <div title="渐变层之间的颜色差异">
                        渐变步长 <span>(层数更少)</span>
                    </div>
                </div>
                <div id="layerdifferencevalue" class="clustering-color-options">
                    16
                </div>
                <div class="clustering-color-options">
                    <input id="layerdifference" type="range" min="0" max="255" step="1" value="16">
                </div>

                <p></p>

                <div>
                    <div title="将像素簇转换为矢量形状的算法">
                        曲线拟合
                    </div>
                </div>

                <div>
                    <div>
                        <button id="none" title="精确匹配像素边界">像素</button>
                        <button id="polygon" title="简化为多边形">多边形</button>
                        <button id="spline" class="selected" title="平滑与曲线拟合">平滑曲线</button>
                    </div>
                </div>

                <div class="spline-options">
                    <div title="被视为拐角（平滑后仍保留直角）的最小瞬时角度">
                        拐角阈值 <span>(边缘更平滑)</span>
                    </div>
                </div>
                <div id="cornervalue" class="spline-options">
                    60
                </div>
                <div class="spline-options">
                    <input id="corner" type="range" min="0" max="180" step="1" value="60">
                </div>

                <div class="spline-options">
                    <div title="执行迭代细分平滑，直到所有线段短于此长度">
                        线段长度 <span>(轮廓更粗略)</span>
                    </div>
                </div>
                <div id="lengthvalue" class="spline-options">
                    4
                </div>
                <div class="spline-options">
                    <input id="length" type="range" min="3.5" max="10" step="0.5" value="4">
                </div>

                <div class="spline-options">
                    <div title="被视为曲线间切割点的最小角度位移">
                        拼接阈值 <span>(细节更精确)</span>
                    </div>
                </div>
                <div id="splicevalue" class="spline-options">
                    45
                </div>
                <div class="spline-options">
                    <input id="splice" type="range" min="0" max="180" step="1" value="45">
                </div>
                
                <div style="display: none">
                <div class="spline-options">
                    <div title="SVG 路径代码中保留的小数位数">
                        路径精度 <span>(小数位更多)</span>
                    </div>
                </div>
                <div id="pathprecisionvalue" class="spline-options">
                    8
                </div>
                <div class="spline-options">
                    <input id="pathprecision" class="uk-range" type="range" min="0" max="16" step="1" value="8">
                </div>
                </div>
            </div>
        </div>
        <script src="./bootstrap.js"></script>
    </body>
</html>
